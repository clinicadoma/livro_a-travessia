<div class="swiper-slide">
    <div class="doma-pagina" id="pag-capitulo-1"><div class="btn-voltar-sumario" onclick="irParaTela('pag-mapa-final')">☰</div>
        <div class="wrapper-isolado">
            <h2 class="doma-titulo-gigante">CAPÍTULO 1<br><span style="color: #0ea5e9; font-size: 1.4rem;">O Acolhimento</span></h2>
            <div style="background: #f0f9ff; border: 3px solid #bae6fd; border-radius: 20px; padding: 4vh 20px; text-align: center; margin-top: 3vh; width: 100%;">
                <p style="color: #0369a1; font-weight: 900; font-size: 1.1rem; margin-top:0;">📢 MISSÃO PRÁTICA! 🎮</p>
                <p class="doma-texto-corrido" style="text-align: center; margin: 2vh 0; color: #0c4a6e;">O jogo abaixo não é só brincadeira, é um <strong>TREINAMENTO</strong>. Encontre os pares de cada "monstrinho".</p>
                <button class="btn-doma btn-doma-azul efeito-tremor" onclick="revelarMonstrinhos(this, event)">🎮 REVELAR JOGO ➔</button>
            </div>
        </div>
    </div>
</div>
  
  
  
<script>
function revelarMonstrinhos(btn, event) {
    if(event) { event.preventDefault(); event.stopPropagation(); }
    
    // 1. Desativa o botão temporariamente para evitar duplo clique
    btn.disabled = true;

    // 2. Avança para a tela do jogo PRIMEIRO
    if (typeof swiperDoma !== 'undefined') {
        swiperDoma.slideNext();
    } else {
        var swiperDOM = document.querySelector('.swiper') || document.querySelector('.swiper-container');
        if (swiperDOM && swiperDOM.swiper) {
            swiperDOM.swiper.slideNext();
        } else if (typeof mudarPagina === 'function') {
            mudarPagina(1);
        }
    }

    // 3. Espera a tela chegar (600ms) e SÓ ENTÃO monta as cartas
    // Isso impede o jogo de dar "vitória instantânea" por não achar o espaço da tela
    setTimeout(function() {
        if (typeof iniciarFluxoDoJogo === 'function') {
            iniciarFluxoDoJogo();
        }
        btn.disabled = false;
    }, 600);
}
</script>
