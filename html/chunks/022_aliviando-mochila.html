<div class="doma-pagina bg-grad-roxoverde" id="aliviando-mochila" style="min-height: 100vh; padding: 15px; box-sizing: border-box;">
    <div class="btn-voltar-sumario" onclick="irParaTela('pag-mapa-final')">☰</div>
    
    <div class="wrapper-isolado" style="width: 100%; max-width: 600px; margin: 0 auto; padding: 10px; box-sizing: border-box;">
        
        <!-- Card Principal Estilo Neumorfismo / Glassmorphism -->
        <div style="background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid #e9d5ff; padding: 3vh 20px; border-radius: 24px; width: 100%; box-shadow: 0 10px 25px rgba(168, 85, 247, 0.08); box-sizing: border-box;">
            
            <!-- Cabeçalho Convidativo -->
            <div class="titulo-pontilhado" style="width: 100%; font-size: 1.3rem; font-weight: bold; text-align: center; color: #6b21a8; margin-bottom: 1vh; font-family: 'Quicksand', sans-serif;">
                📝 Exercício: Aliviando a Mochila
            </div>
            <p class="doma-texto-corrido" style="margin-bottom: 4vh; text-align: center; font-size: 0.9rem; color: #6b7280; line-height: 1.4; padding: 0 10px; margin-top: 0;">
                Colocar em palavras ajuda a desatar os nós do peito. Toque nos campos abaixo e esvazie o que pesa em você.
            </p>

            <!-- Bloco de Exercícios -->
            <div style="display: flex; flex-direction: column; gap: 24px; width: 100%; box-sizing: border-box; margin-bottom: 3vh;">
                
                <!-- Pergunta 1 -->
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <label for="planner-1" style="font-size: 0.95rem; font-weight: bold; color: #4b5563; font-family: 'Quicksand', sans-serif;">
                        1. O que o meu corpo mais pede hoje é...
                    </label>
                    <textarea id="planner-1" class="doma-textarea-curto" placeholder="Ex: Descanso de 15 minutos sem celular, ou beber mais água..." style="width: 100%; min-height: 70px; padding: 12px; border-radius: 12px; border: 1.5px solid #e5e7eb; background: #fafafa; font-size: 0.9rem; color: #1f2937; box-sizing: border-box; resize: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='#a855f7'; this.style.background='#fff'" onblur="this.style.borderColor='#e5e7eb'; this.style.background='#fafafa'"></textarea>
                </div>

                <!-- Pergunta 2 -->
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <label for="planner-2" style="font-size: 0.95rem; font-weight: bold; color: #4b5563; font-family: 'Quicksand', sans-serif;">
                        2. O comentário que NÃO vou absorver mais é...
                    </label>
                    <textarea id="planner-2" class="doma-textarea-curto" placeholder="Ex: Aquela crítica sobre eu não estar fazendo o suficiente..." style="width: 100%; min-height: 70px; padding: 12px; border-radius: 12px; border: 1.5px solid #e5e7eb; background: #fafafa; font-size: 0.9rem; color: #1f2937; box-sizing: border-box; resize: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='#a855f7'; this.style.background='#fff'" onblur="this.style.borderColor='#e5e7eb'; this.style.background='#fafafa'"></textarea>
                </div>

                <!-- Pergunta 3 -->
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <label for="planner-3" style="font-size: 0.95rem; font-weight: bold; color: #4b5563; font-family: 'Quicksand', sans-serif;">
                        3. O sonho que eu vou adaptar (sem desistir) é...
                    </label>
                    <textarea id="planner-3" class="doma-textarea-curto" placeholder="Ex: Fazer minha viagem, mas dividindo em duas etapas menores..." style="width: 100%; min-height: 70px; padding: 12px; border-radius: 12px; border: 1.5px solid #e5e7eb; background: #fafafa; font-size: 0.9rem; color: #1f2937; box-sizing: border-box; resize: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='#a855f7'; this.style.background='#fff'" onblur="this.style.borderColor='#e5e7eb'; this.style.background='#fafafa'"></textarea>
                </div>

                <!-- Pergunta 4 -->
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <label for="planner-4" style="font-size: 0.95rem; font-weight: bold; color: #4b5563; font-family: 'Quicksand', sans-serif;">
                        4. O que eu mais preciso ouvir de mim hoje é...
                    </label>
                    <textarea id="planner-4" class="doma-textarea-curto" placeholder="Ex: 'Eu fiz o meu melhor hoje e está tudo bem.'" style="width: 100%; min-height: 70px; padding: 12px; border-radius: 12px; border: 1.5px solid #e5e7eb; background: #fafafa; font-size: 0.9rem; color: #1f2937; box-sizing: border-box; resize: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='#a855f7'; this.style.background='#fff'" onblur="this.style.borderColor='#e5e7eb'; this.style.background='#fafafa'"></textarea>
                </div>

            </div>

            <!-- Botão de validação integrado perfeitamente dentro do card -->
            <button class="btn-doma btn-doma-roxo efeito-tremor" style="margin-top: 1vh; width: 100%; box-sizing: border-box;" onclick="processarFormulario(['planner-1','planner-2','planner-3','planner-4'], 'planner_mochila', 15, 'Validado com Sucesso! 🏆', 'Você teve a coragem de olhar para os seus desafios mais íntimos. Cada palavra escrita deixou sua mochila mais leve. Você está na condução!', 'sucesso', 1)">
                ✨ VALIDAR ESFORÇOS ➔
            </button>
            
        </div>
    </div>
</div>
